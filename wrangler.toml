# ============================================================
# 庄骆贵园林养护成效管理系统 · Cloudflare 配置
# ============================================================
name = "zlg-garden-maintenance"
compatibility_date = "2025-10-01"
pages_build_output_dir = "public"

# 注意：pages_build_output_dir 绝不能设成 "."，否则会把本配置、schema.sql、后端源码一起发布

# ---- D1 数据库 ----
# 部署时执行 `npx wrangler d1 create zlg-garden-db` 获取真实 database_id，
# 把下面占位 UUID 替换成返回的值。
[[d1_databases]]
binding = "DB"
database_name = "zlg-garden-db"
database_id = "091da0ce-f083-44bb-8f24-f0e71aa066ae"

# ---- R2 对象存储（照片）----
# 部署时执行 `npx wrangler r2 bucket create zlg-garden-photos`。
# 注意：R2 桶未创建时，启用此绑定会导致 `pages deploy` 失败。
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "zlg-garden-photos"

# ---- 环境变量 ----
[vars]
PHOTO_STORE = "r2"
